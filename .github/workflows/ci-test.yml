name: ci-test.yml

on:
  # 자동 트리거가 안 걸릴 때(오래된 PR synchronize, Actions 지연/복구 후 등) Actions UI에서 수동 실행.
  workflow_dispatch:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

jobs:
  code-test:
    name: 코드 테스트
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: 브랜치의 소스코드 체크아웃 실행
        uses: actions/checkout@v6
      - name: 테스트용 JDK 설치
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: gradlew 권한설정
        run: chmod +x ./gradlew
      - name: 테스트 실행
        run: ./gradlew test --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
