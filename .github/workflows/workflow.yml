name: CI · test & publish image

on:
  push:
    branches: [dev, main]        # 머지되면 이미지 빌드·푸시(publish)
  pull_request:
    branches: [dev, main]        # PR이면 테스트만

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write            # GHCR 푸시 권한

    services:
      redis:                     # @SpringBootTest 컨텍스트가 Redis를 요구함
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: JDK 25 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: gradlew 권한
        run: chmod +x ./gradlew

      - name: 테스트 (test 프로파일 = H2)
        run: ./gradlew test --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test
          testDbUrl: 'jdbc:h2:mem:testdb;MODE=MySQL;NON_KEYWORDS=USER;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE'
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
          baseUrl: http://localhost:3000
          base64UuidKey: dummybase64uuidkeydummybase64uuidkey
          vanillaKey: dummyvanillakeydummyvanillakey
          accessTokenTime: '1800000'
          refreshTokenTime: '604800000'
          googleClientId: dummy
          googleClientSecretKey: dummy
          naverClientId: dummy
          naverClientSecretKey: dummy
          s3BucketName: dummy
          s3AccessKey: dummy
          s3SecretKey: dummy
          s3Region: ap-northeast-2

      # ── 아래는 머지(push)일 때만: 이미지 빌드 & GHCR 푸시 ──
      - name: GHCR 로그인
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 & Push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/teabag-be/asset-box:latest
            ghcr.io/teabag-be/asset-box:${{ github.sha }}
