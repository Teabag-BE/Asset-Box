# AssetBox 단일 인스턴스 배포 (app + db + redis + frontend)
#   단일 EC2 + 스왑 메모리 전략 (app/db 분리 안 함)
#   실행:  docker compose --env-file .env.production up -d --build
#   - 같은 폴더에 .env.production (실값) 필요 (템플릿: .env.production.example)
#   - 프론트는 형제 폴더 ../teabag-front 를 빌드 (둘 다 클론돼 있어야 함)
#   - 메모리 부족은 스왑으로 흡수 (DEPLOY.md "스왑 메모리 설정" 참고)
name: assetbox

services:
  # ── MySQL (영구 저장) ──
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${dbUserName}
      MYSQL_PASSWORD: ${dbPassWord}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - asset

  # ── Redis (리프레시 토큰 저장) ──
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - asset

  # ── 백엔드 (Spring) ──
  app:
    build: .                                            # EC2에서 직접 빌드할 때
    image: ${APP_IMAGE:-ghcr.io/teabag-be/asset-box:latest}   # ghcr pull 할 때
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"            # 힙은 RAM 안에 유지(스왑된 힙=GC 악화 방지)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./.env.production:/app/.env.production:ro
    restart: unless-stopped
    # ports: ["8080:8080"]   # 디버깅 시에만. 평소엔 frontend가 /api로 프록시
    networks:
      - asset

  # ── 프론트 (React 빌드 → nginx, /api 프록시) ──
  frontend:
    build:
      context: ../teabag-front
      args:
        VITE_API_BASE_URL: /api
    image: ${FRONT_IMAGE:-ghcr.io/teabag-be/asset-box-front:latest}
    depends_on:
      - app
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - asset

volumes:
  mysql_data:
  redis_data:

networks:
  asset:
    driver: bridge
