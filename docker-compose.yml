name: assetbox

# 모든 컨테이너 공통 로그 로테이션 — 로그가 30GB 디스크를 채우지 않도록(서비스당 최대 50MB).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - asset

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    logging: *default-logging
    networks:
      - asset

  app:
    build: .
    image: ${APP_IMAGE:-ghcr.io/teabag-be/asset-box:latest}
    env_file:
      - .env.production
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging
    networks:
      - asset

  frontend:
    build:
      context: ../teabag-front
      args:
        VITE_API_BASE_URL: /api
    image: ${FRONT_IMAGE:-ghcr.io/teabag-be/asset-box-front:latest}
    depends_on:
      - app
    expose:
      - "80"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - asset

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    depends_on:
      - frontend
      - app
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    restart: unless-stopped
    logging: *default-logging
    networks:
      - asset

  # 모니터링 에이전트 — Docker 로그 → Loki, 호스트/앱 메트릭 → Prometheus (Grafana Cloud).
  # 설정은 config.alloy, 자격증명은 .env.production 의 GRAFANA_CLOUD_* env.
  alloy:
    image: grafana/alloy:latest
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    env_file:
      - .env.production
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # 호스트 메트릭(unix exporter)용 읽기전용 마운트
      - /:/rootfs:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    restart: unless-stopped
    logging: *default-logging
    networks:
      - asset

volumes:
  mysql_data:
  redis_data:
  npm_data:
  npm_letsencrypt:
  alloy_data:

networks:
  asset:
    driver: bridge
