spring:
  application:
    name: asset-box
  config:
    import: optional:file:.env.development[.properties]
  datasource:
    url: ${dbUrl}
    username: ${dbUserName}
    password: ${dbPassWord}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:create-drop}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
    baseline-on-migrate: false
    validate-on-migrate: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-name: Google
            client-id: ${googleClientId}
            client-secret: ${googleClientSecretKey}
            redirect-uri: "{baseUrl}/{action}/oauth2/code/{registrationId}"
            scope:
              - email
          naver:
            client-name: Naver
            client-id: ${naverClientId}
            client-secret: ${naverClientSecretKey}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/{action}/oauth2/code/{registrationId}"
            scope:
              - email
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize # API 기본 정보
            user-name-attribute: response
            token-uri: https://nid.naver.com/oauth2.0/token # API 기본 정보
            user-info-uri: https://openapi.naver.com/v1/nid/me #자원서버
  cloud:
    aws:
      region:
        static: ${s3Region}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
custom:
  baseUrl: ${baseUrl}
  jwt:
    payload:
      issuer: wjdtn747@naver.com
      subjectAccessToken: access-token
      subjectRefreshToken: refresh-token
    secrets:
      appkey: ${base64UuidKey}
      vanillakey: ${vanillaKey}
    validations:
      access: ${accessTokenTime}
      refresh: ${refreshTokenTime}
  s3:
    bucket-name: ${s3BucketName}
    access-key: ${s3AccessKey}
    secret-key: ${s3SecretKey}
  redis:
    host: ${redis.host}
    port: ${redis.port}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /v3/swagger-ui
    operations-sorter: alpha
    display-request-duration: true
    doc-expansion: none
    persist-authorization: true
