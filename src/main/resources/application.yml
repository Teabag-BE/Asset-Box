spring:
  application:
    name: asset-box
  config:
    import: optional:file:.env.development[.properties]
  datasource:
    url: ${dbUrl}
    username: ${dbUserName}
    password: ${dbPassWord}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
    baseline-on-migrate: false
    validate-on-migrate: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-name: Google
            client-id: ${googleClientId}
            client-secret: ${googleClientSecretKey}
            redirect-uri: "{baseUrl}/{action}/oauth2/code/{registrationId}"
            scope:
              - email
          naver:
            client-name: Naver
            client-id: ${naverClientId}
            client-secret: ${naverClientSecretKey}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/{action}/oauth2/code/{registrationId}"
            scope:
              - email
          provider:
            naver:
              authorization-uri: https://nid.naver.com/oauth2.0/authorize # API 기본 정보
              user-name-attribute: response
              token-uri: https://nid.naver.com/oauth2.0/token # API 기본 정보
              user-info-uri: https://openapi.naver.com/v1/nid/me #자원서버
  cloud:
    aws:
      region:
        static: ${s3Region}
custom:
  jwt:
    secrets:
      app-key: ${base64UuidKey}
      vanilla-key: ${vanillaKey}
  validations:
    access: ${accessTokenTime}
    refresh: ${refreshTokenTime}

  s3:
    bucket-name: ${s3BucketName}
    access-key: ${s3AccessKey}
    secret-key: ${s3SecretKey}
