# ── App 서버 (EC2 #1): frontend(nginx) + Spring + Redis ──
#   실행:  docker compose -f docker-compose.app.yml --env-file .env.production up -d
#   .env.production 의 dbUrl 은 DB서버 private IP 를 가리켜야 함.
name: assetbox-app

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    mem_limit: 128m
    restart: unless-stopped
    networks:
      - asset

  app:
    image: ${APP_IMAGE:-ghcr.io/teabag-be/asset-box:latest}
    environment:
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx768m"   # t3.small: redis+nginx와 공유, 힙 768m
    mem_limit: 1400m
    depends_on:
      - redis
    volumes:
      - ./.env.production:/app/.env.production:ro   # dbUrl=DB서버 private IP
    restart: unless-stopped
    networks:
      - asset
    # DB는 다른 EC2 → compose가 health 못 봄. DB서버를 먼저 띄우고, 안 떠도 app이 재시도(restart)함.

  frontend:
    image: ${FRONT_IMAGE:-ghcr.io/teabag-be/asset-box-front:latest}
    ports:
      - "80:80"            # nginx: 정적 + /api → app:8080 프록시
    depends_on:
      - app
    mem_limit: 64m
    restart: unless-stopped
    networks:
      - asset

volumes:
  redis_data:

networks:
  asset:
    driver: bridge
